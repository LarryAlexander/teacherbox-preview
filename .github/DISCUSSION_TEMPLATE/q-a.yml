title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about trying the TeacherBox preview. This discussion is public and linked to your GitHub identity. Do not include student-identifying or other sensitive information.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      placeholder: How do I...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Include only general steps and fictional examples.
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Before posting
      options:
        - label: I checked that my post contains no student-identifying or other sensitive information.
          required: true
