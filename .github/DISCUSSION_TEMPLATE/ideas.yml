title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for the TeacherBox preview. This discussion is public and linked to your GitHub identity. Do not include student-identifying or other sensitive information.
  - type: textarea
    id: idea
    attributes:
      label: What would you like TeacherBox to do?
      description: Describe the idea in general terms.
      placeholder: It would help if...
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What classroom task or need would it help with?
      description: Please do not include details about individual students.
    validations:
      required: true
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Before posting
      options:
        - label: I checked that my post contains no student-identifying or other sensitive information.
          required: true
